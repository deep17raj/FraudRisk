# Render blueprint: ONE web service hosting all seven intents. The four network-check intents
# (ip-geolocation, email-security, url-safe, malware-detection) need no API key and add no variables.
# NOTE: the free web-service tier sleeps after ~15 min idle (30-60 s cold start), which will
# fail Telegraph's spot-checks and can cost you routing. Use the paid "starter" instance below,
# or keep a pinger hitting /healthz.
services:
  - type: web
    name: telegraph-intent-miner
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- shared by all intents
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Per-intent model. Prefix = FRAUDRISK_ / FACTCHECK_ / AUDIT_ (see telegraphintent/app.py).
      - key: FRAUDRISK_ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: FRAUDRISK_ANTHROPIC_EFFORT
        value: low
      - key: FACTCHECK_ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: AUDIT_ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: AUDIT_ANTHROPIC_EFFORT
        value: low
      # --- fraud risk
      - key: IPINFO_TOKEN
        sync: false
      - key: IP2LOCATION_KEY
        sync: false
      - key: REASONING_MODE
        value: auto
      # --- fact check
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
      - key: STANCE_MODE
        value: auto
      # --- contract audit
      - key: EXTRACTION_MODE
        value: auto
      # --- optional: Groq writes/judges answers for web_search, chat_completion, research_query, security_review and
      # --- event_outcome. Leave it unset and they answer from public sources. See docs/MoreIntents.md.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
